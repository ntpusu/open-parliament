<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9.55 0 79.5 79.5">
  <!-- 學生議會標誌的 favicon 版本：正方形畫布、門框線加粗以便在 16px 仍清楚；深色主題時調亮 -->
  <style>
